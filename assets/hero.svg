<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Nubo, Elias Coto's mascot, floating over the purple band.">
<style>
.fl { animation: fl 6s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
.ey { transform-box: fill-box; transform-origin: center; animation: ey 6s infinite; }
@keyframes ey { 0%, 44%, 50%, 100% { transform: scaleY(1) } 47% { transform: scaleY(.1) } 78%, 92% { transform: scaleY(0) } }
.hp { opacity: 0; animation: hp 6s infinite; }
@keyframes hp { 0%, 77.9%, 92.1%, 100% { opacity: 0 } 78%, 92% { opacity: 1 } }
.bl { animation: bl 40s steps(120) infinite; }
.br { animation: br 40s steps(120) infinite; }
@keyframes bl { from { transform: translateX(0) } to { transform: translateX(-1200px) } }
@keyframes br { from { transform: translateX(-1200px) } to { transform: translateX(0) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
