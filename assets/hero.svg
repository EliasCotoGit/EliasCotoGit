<linearGradient id="vb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6C47FF" stop-opacity="0"/><stop offset=".25" stop-color="#6C47FF" stop-opacity=".55"/><stop offset=".5" stop-color="#7A55FF" stop-opacity=".75"/><stop offset=".75" stop-color="#6C47FF" stop-opacity=".55"/><stop offset="1" stop-color="#6C47FF" stop-opacity="0"/></linearGradient>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".35" stop-color="#E4DBFF" stop-opacity=".55"/><stop offset=".7" stop-color="#9C84FF" stop-opacity=".18"/><stop offset="1" stop-color="#6C47FF" stop-opacity="0"/></radialGradient>
<radialGradient id="pinch" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0A0A0A" stop-opacity=".95"/><stop offset=".6" stop-color="#0A0A0A" stop-opacity=".6"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/></radialGradient>
<linearGradient id="ft" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/></linearGradient>
<linearGradient id="fb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0A0A0A" stop-opacity="0"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
<radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="s" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#d3d7dc"/><stop offset=".45" stop-color="#9AA0A6"/><stop offset="1" stop-color="#565b61"/></radialGradient>
<radialGradient id="v" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="#a558fb" stop-opacity=".55"/><stop offset=".6" stop-color="#6c47ff" stop-opacity=".08"/><stop offset="1" stop-color="#6c47ff" stop-opacity="0"/></radialGradient>
<radialGradient id="k"><stop offset="0" stop-color="#c084fc" stop-opacity=".6"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
<radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
