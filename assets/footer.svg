<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Let’s build something that ships.">
<style><![CDATA[
.a { animation: up 1.1s cubic-bezier(.22,1,.36,1) both; } .b { animation-delay: .15s }
@keyframes up { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: none } }
.g { animation: g 6s ease-in-out infinite alternate; } @keyframes g { from { opacity: .6 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
]]></style>
<defs>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#4C35C7"/><stop offset=".3" stop-color="#8B6BFF"/><stop offset=".5" stop-color="#F1ECFF"/><stop offset=".7" stop-color="#8B6BFF"/><stop offset="1" stop-color="#4C35C7"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C9B8FF" stop-opacity=".6"/><stop offset=".4" stop-color="#7A55FF" stop-opacity=".25"/><stop offset="1" stop-color="#6C47FF" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
<mask id="m"><rect x="0" y="236" width="1200" height="94" fill="url(#fade)"/></mask>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity=".055"/></pattern>
<clipPath id="fc"><rect width="1200" height="330" rx="28"/></clipPath>
</defs>
<g clip-path="url(#fc)">
<rect width="1200" height="330" fill="#0A0A0A"/><rect width="1200" height="330" fill="url(#dots)"/>
<text class="a" x="600" y="118" text-anchor="middle" font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="-2" fill="#F5F5F5">Let’s build something that ships.</text>
<text class="a b" x="600" y="162" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#8E9196">DESIGNED WITH AI <tspan opacity=".45">·</tspan> ENGINEERED WITH TYPESCRIPT <tspan opacity=".45">·</tspan> COSTA RICA</text>
<ellipse class="g" cx="600" cy="330" rx="600" ry="90" fill="url(#glow)"/>
