<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="ft">
<title id="ft">Let's build something that ships. Elias Coto, Costa Rica.</title>
<style><![CDATA[
.fb-l, .fb-r { animation-timing-function: linear; animation-iteration-count: infinite; }
.fb-l { animation-name: fbL; } .fb-r { animation-name: fbR; }
@keyframes fbL { from { transform: translateX(0) } to { transform: translateX(-618px) } }
@keyframes fbR { from { transform: translateX(-618px) } to { transform: translateX(0) } }

.glow { animation: glow 5s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .7 } to { opacity: 1 } }
.up { animation: up 1.6s cubic-bezier(.22,1,.36,1) .3s both; }
@keyframes up { from { transform: translateY(60px); opacity: 0 } to { transform: none; opacity: 1 } }
.ffloat { animation: ffl 5s ease-in-out infinite; }
@keyframes ffl { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
.feyes { transform-box: fill-box; transform-origin: center; animation: fbl 4.5s infinite; }
@keyframes fbl { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(0.12) } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
]]></style>
